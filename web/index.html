<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#e3e3e3">
  <meta name="description" content="روزانہ اردو لفظ کی پہیلی — پانچ حرف، پانچ کوششیں">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="لفظ">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>لفظ | روز کا اردو لفظ</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      height: 100%;
      height: 100dvh;
      margin: 0;
      background: #e3e3e3;
    }
    #lafz-boot {
      position: fixed;
      inset: 0;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #1a1a1b;
      background: #e3e3e3;
      font-family: "Noto Naskh Arabic", "Geeza Pro", "Noto Nastaliq Urdu", serif;
      text-align: center;
      padding: 24px;
      gap: 16px;
    }
    .logo { display: grid; grid-template-columns: repeat(3, 18px); gap: 3px; }
    .logo i { width: 18px; height: 18px; display: block; }
    .logo .g { background: #6aaa64; }
    .logo .y { background: #c9b458; }
    .logo .e { background: #d3d6da; }
    h1 { font-size: 56px; font-weight: 800; margin: 8px 0 0; }
    p { font-size: 18px; line-height: 1.5; margin: 0; max-width: 22rem; }
    #lafz-play {
      border: 0;
      background: #1a1a1b;
      color: #fff;
      font: inherit;
      font-size: 18px;
      font-weight: 700;
      padding: 14px 36px;
      border-radius: 999px;
      cursor: pointer;
    }
    #lafz-hint { font-size: 14px; color: #787c7e; }
  </style>
</head>
<body>
  <div id="lafz-boot">
    <div class="logo" aria-hidden="true">
      <i class="g"></i><i class="e"></i><i class="y"></i>
      <i class="e"></i><i class="g"></i><i class="e"></i>
      <i class="y"></i><i class="e"></i><i class="g"></i>
    </div>
    <h1>لفظ</h1>
    <p>پانچ موقع تاکہ ایک پانچ حرفی لفظ معلوم ہو۔</p>
    <button type="button" id="lafz-play">کھیلیں</button>
    <p id="lafz-hint" hidden>اگر کھیل نہیں کھلتا تو صفحہ ریفریش کریں۔</p>
  </div>
  <script>
    {{flutter_js}}
    {{flutter_build_config}}
    (function () {
      var boot = document.getElementById('lafz-boot');
      var play = document.getElementById('lafz-play');
      var hint = document.getElementById('lafz-hint');
      if (play) {
        play.addEventListener('click', function () { location.reload(); });
      }
      setTimeout(function () {
        if (boot && hint) hint.hidden = false;
      }, 8000);
      _flutter.loader.load({
        onEntrypointLoaded: async function (engineInitializer) {
          const appRunner = await engineInitializer.initializeEngine();
          if (boot) boot.remove();
          await appRunner.runApp();
        }
      });
    })();
  </script>
</body>
</html>
