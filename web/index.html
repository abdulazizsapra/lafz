<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="روزانہ اردو لفظ کی پہیلی — پانچ حرف، پانچ کوششیں">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="لفظ">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>لفظ | روز کا اردو لفظ</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      height: 100%;
      height: 100dvh;
      margin: 0;
      background: #ffffff;
    }
    #lafz-boot {
      position: fixed;
      inset: 0;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #1a1a1b;
      background: #ffffff;
      font-family: "Noto Naskh Arabic", "Geeza Pro", "Noto Nastaliq Urdu", serif;
      gap: 12px;
    }
    #lafz-boot strong { font-size: 40px; font-weight: 700; }
    #lafz-boot span { font-size: 16px; opacity: 0.7; }
  </style>
</head>
<body>
  <div id="lafz-boot">
    <strong>لفظ</strong>
    <span>لوڈ ہو رہا ہے…</span>
  </div>
  <script>
    {{flutter_js}}
    {{flutter_build_config}}
    _flutter.loader.load({
      onEntrypointLoaded: async function (engineInitializer) {
        const appRunner = await engineInitializer.initializeEngine();
        const boot = document.getElementById('lafz-boot');
        if (boot) boot.remove();
        await appRunner.runApp();
      }
    });
  </script>
</body>
</html>
