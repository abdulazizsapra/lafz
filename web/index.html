<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="روزانہ اردو لفظ کی پہیلی — پانچ حرف، پانچ کوششیں">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="لفظ">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>لفظ | روز کا اردو لفظ</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      height: 100%;
      height: 100dvh;
      margin: 0;
      background: #ffffff;
    }
    #lafz-boot {
      min-height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #1a1a1b;
      font-family: "Noto Naskh Arabic", "Geeza Pro", "Noto Nastaliq Urdu", serif;
      gap: 12px;
    }
    #lafz-boot strong { font-size: 40px; font-weight: 700; }
    #lafz-boot span { font-size: 16px; opacity: 0.7; }
  </style>
</head>
<body>
  <div id="lafz-boot">
    <strong>لفظ</strong>
    <span>لوڈ ہو رہا ہے…</span>
  </div>
  <script>
    // Drop stale service workers / caches from earlier /lafz/ builds.
    // A leftover worker is the usual reason this URL stays blank locally.
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (regs) {
        regs.forEach(function (reg) { reg.unregister(); });
      });
    }
    if (window.caches) {
      caches.keys().then(function (keys) {
        keys.forEach(function (key) { caches.delete(key); });
      });
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
